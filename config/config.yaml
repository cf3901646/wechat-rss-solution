# 微信公众号 RSS 定时拉取与 Markdown 知识库归档配置文件

# ==========================================
# 1. RSS 订阅源列表
# ==========================================
rss_feeds:
  # 默认连接本地或 VPS 的 we-mp-rss 导出的订阅源
  - name: "公众号汇总源"
    url: "http://localhost:8001/feeds/all.xml"
    enabled: true

# ==========================================
# 2. 存储与归档设置
# ==========================================
storage:
  # Markdown 保存目录（支持相对路径或绝对路径）
  output_dir: "./output/articles"

  # 是否下载文章中的微信图片至本地（强烈建议开启）
  download_images: true

  # 图片存放子目录名
  images_dir_name: "images"

  # 增量同步历史记录库
  history_db_path: "./output/sync_history.json"

# ==========================================
# 3. 内容清洗选项
# ==========================================
cleaner:
  remove_ads: true
  filter_keywords:
    - "点击上方蓝字关注"
    - "长按二维码识别关注"
    - "喜欢本文请点在看"
    - "未经授权禁止转载"
    - "欢迎关注公众号"
    - "扫码进入交流群"

# ==========================================
# 4. 定时轮询调度配置（仅在 --daemon 模式下生效）
# ==========================================
scheduler:
  interval_minutes: 60

# ==========================================
# 5. 消息推送与通知（可选）
# ==========================================
notification:
  channel: "none"
  webhook_url: ""
  notify_on_new_articles: true
  notify_on_failure: true
